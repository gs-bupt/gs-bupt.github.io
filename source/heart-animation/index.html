<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070712">
    <meta name="description" content="心动星河：全屏 3D 粒子心形互动页">
    <title>心动星河</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600&display=swap">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <canvas id="scene" aria-label="3D 粒子心形星河动画" role="img"></canvas>

    <header class="hud hud-top">
      <a class="brand" href="/" aria-label="返回博客首页"><span>✦</span> Gs-Blog</a>
      <span class="hud-note">CANVAS · 3D PARTICLES · REALTIME</span>
    </header>

    <div class="hud hud-side">
      <p class="kicker">α SCORPII · 心宿二 · THE HEART STAR</p>
      <h1 id="page-title">心动<em>星河</em></h1>
    </div>

    <p class="hud quote" id="quote" aria-live="polite">有些光，不必喧闹，也足够照亮彼此。</p>

    <footer class="hud hud-bottom">
      <p class="hint">移动鼠标倾斜星河 · 点击心形迸发粒子</p>
      <div class="actions" aria-label="互动控制">
        <button class="action primary" id="igniteButton" type="button">点亮星河</button>
        <button class="action ghost" id="fullscreenButton" type="button">全屏沉浸</button>
      </div>
    </footer>

    <script src="./script.js" defer></script>
  </body>
</html>
