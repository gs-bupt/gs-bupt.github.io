version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Asia/Shanghai
  open-pull-requests-limit: 10
  groups:
    hexo-stack:
      patterns:
        - "hexo*"
        - "@renbaoshuo/*"
      update-types:
        - minor
        - patch
    npm-minor-and-patch:
      update-types:
        - minor
        - patch
